<!DOCTYPE html>
<html lang="vi" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}"
    />

    <title>{% block title %}TA AI Assistant{% endblock %}</title>
  </head>
  <body>
    {% block content %} {% endblock content %}
    <!-- Nạp script ở cuối body (từ base.html dời sang) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
    <script>
      /* Cập nhật logic cho avatar */
      function updateUserAvatar(isLight) {
        const avatar = document.getElementById("user-avatar");
        if (!avatar) return;

        const baseSrc = avatar.src.split("?")[0];
        const name = new URL(avatar.src).searchParams.get("name") || "User";

        if (isLight) {
          // Light mode: Nền sáng (f5f5f5), chữ tối (333333)
          avatar.src = `${baseSrc}?name=${name}&background=f5f5f5&color=333333`;
        } else {
          // Dark mode: Nền tối (1e1e1e), chữ sáng (ffffff)
          avatar.src = `${baseSrc}?name=${name}&background=1e1e1e&color=ffffff`;
        }
      }

      /* Light/dark toggle */
      function toggleLight() {
        document.documentElement.classList.toggle("light");
        const isLight = document.documentElement.classList.contains("light");
        localStorage.setItem("theme", isLight ? "light" : "");
        updateUserAvatar(isLight); // Cập nhật avatar khi
      }

      /* Khôi phục theme đã lưu và cập nhật avatar khi tải trang */
      (function () {
        const isLight = localStorage.getItem("theme") === "light";
        if (isLight) {
          document.documentElement.classList.add("light");
        }
        updateUserAvatar(isLight);
      })();
    </script>
  </body>
</html>
